name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# go-speedtest sits downstream of go-gui, go-charts and go-map, and pins
# published tags of all three. CI therefore builds straight from the module
# proxy: no sibling checkouts and no replace directives, unlike the library
# repos upstream. A red build here means a released tag is broken.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # go.mod names the toolchain, so CI and a local build agree.
          go-version-file: go.mod

      # No system packages. go-glyph has been pure Go since v1.19 (no
      # FreeType, HarfBuzz, Pango or SDL) and go-gui reaches GL through
      # purego, so Linux builds and tests with cgo disabled.
      #
      # macOS is the exception: the Metal backend is cgo. Without this
      # the darwin build still succeeds, but it silently links no Metal
      # and produces a binary whose GUI cannot open a window.
      - name: Enable cgo for the Metal backend
        if: runner.os == 'macOS'
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Build
        run: go build ./...

      # The probe tests serve every endpoint from httptest, so this job does
      # not reach speed.cloudflare.com and cannot be rate limited.
      - name: Test
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Matches the pin in go-charts, go-glyph and go-term, so a local
          # lint pass and a CI lint pass mean the same thing.
          version: v2.12.2
          args: ./...
