name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# go-speedtest sits downstream of go-gui, go-charts and go-map, and pins
# published tags of all three. CI therefore builds straight from the module
# proxy: no sibling checkouts and no replace directives, unlike the library
# repos upstream. A red build here means a released tag is broken.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod names the toolchain, so CI and a local build agree.
          go-version-file: go.mod

      # go-glyph is cgo and needs the text stack. go-gui's own GL backend
      # does not, but the shared dependency pulls these in on both hosts.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2 freetype harfbuzz pango fontconfig
          prefix=$(brew --prefix)
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig:${prefix}/share/pkgconfig" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Build
        run: go build ./...

      # The probe tests serve every endpoint from httptest, so this job does
      # not reach speed.cloudflare.com and cannot be rate limited.
      - name: Test
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Matches the pin in go-charts, go-glyph and go-term, so a local
          # lint pass and a CI lint pass mean the same thing.
          version: v2.12.2
          args: ./...
